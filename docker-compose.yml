services:
  shop-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: imweb-test-shop-server
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_NAME: shop
      DB_USERNAME: shop
      DB_PASSWORD: shop_password
      JWT_ISSUER: http://localhost:8080
      JWT_PRIVATE_KEY_BASE64: ""
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data: